name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build Angular
        run: cd client && npm run build -- --base-href /oila-daraxti-server/

      - name: Install rsvg-convert (SVG to PNG)
        run: sudo apt-get install -y librsvg2-bin

      - name: Convert SVG icons to PNG
        run: |
          mkdir -p client/dist/client/browser/icons
          rsvg-convert -w 192 -h 192 client/public/icons/icon-192.svg -o client/dist/client/browser/icons/icon-192.png
          rsvg-convert -w 512 -h 512 client/public/icons/icon-512.svg -o client/dist/client/browser/icons/icon-512.png

      - name: Copy index.html to 404.html
        run: cp client/dist/client/browser/index.html client/dist/client/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist/client/browser
          force_orphan: true
