<header class="header">
  <div class="header-inner">
    <a routerLink="/home" class="logo">
      <span class="logo-icon">🌳</span>
      <span class="logo-text">{{ t('APP_TITLE') }}</span>
    </a>

    <nav class="nav">
      <a routerLink="/home" routerLinkActive="active" class="nav-link">{{ t('NAV_HOME') }}</a>
      <a routerLink="/notifications" routerLinkActive="active" class="nav-link notif-link">
        {{ t('NAV_NOTIFICATIONS') }}
        @if (notif.unreadCount() > 0) {
          <span class="notif-badge">{{ notif.unreadCount() }}</span>
        }
      </a>
    </nav>

    <div class="header-right">
      <div class="lang-switcher">
        @for (lang of langs; track lang) {
          <button
            class="lang-btn"
            [class.active]="translate.currentLang() === lang"
            (click)="setLang(lang)"
          >{{ lang.toUpperCase() }}</button>
        }
      </div>

      <button class="theme-btn" (click)="themeService.toggle()" [title]="themeService.theme() === 'dark' ? 'Kunduzgi rejim' : 'Tungi rejim'">
        @if (themeService.theme() === 'dark') { ☀️ } @else { 🌙 }
      </button>
    </div>
  </div>
</header>
