<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>{{ t('ADMIN_LOGIN') }}</h1>
      <p>Faqat vakolatli foydalanuvchilar uchun</p>
    </div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>{{ t('USERNAME') }}</label>
        <input type="text" [(ngModel)]="username" name="username" [placeholder]="t('USERNAME')" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>{{ t('PASSWORD') }}</label>
        <input type="password" [(ngModel)]="password" name="password" [placeholder]="t('PASSWORD')" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;margin-top:8px" [disabled]="loading()">
        {{ loading() ? t('LOADING') : t('LOGIN') }}
      </button>
    </form>
  </div>
</div>
